spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tourguide}
    username: ${DB_USER:tourguide}
    password: ${DB_PASSWORD:tourguide123}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  buckets:
    profile-photos: profile-photos
    place-images: place-images
    badge-icons: badge-icons
    quest-verifications: quest-verifications

# Google Vision & Places API Configuration (optional in local dev)
google:
  vision:
    api-key: ${GOOGLE_VISION_API_KEY:}
    confidence-threshold: ${GOOGLE_VISION_CONFIDENCE_THRESHOLD:0.5}
    max-distance-km: ${GOOGLE_VISION_MAX_DISTANCE_KM:1.0}
    fallback-max-distance-km: ${GOOGLE_VISION_FALLBACK_MAX_DISTANCE_KM:2.0}
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}

# JWT Configuration (dev-only fallback; set JWT_SECRET in production)
jwt:
  secret: ${JWT_SECRET:dG91ZG8tZGV2LWp3dC1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLTIwMjY=}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

# AI Service Configuration (demo | ollama | gemini)
ai-service:
  provider: ${AI_PROVIDER:demo}
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  timeout: 30000

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  model-name: ${GEMINI_MODEL_NAME:gemini-2.0-flash}
  temperature: ${GEMINI_TEMPERATURE:0.4}

# Demo Seed Data
app:
  seed-demo-data: ${SEED_DEMO_DATA:true}

# Pilot Zone Configuration (Izmir + Ephesus bounds)
pilot-zone:
  enabled: false
  min-latitude: 37.90
  max-latitude: 38.60
  min-longitude: 26.80
  max-longitude: 27.40
  center-latitude: 38.4192
  center-longitude: 27.1287

logging:
  level:
    com.tourguide: DEBUG
    org.hibernate.SQL: DEBUG
